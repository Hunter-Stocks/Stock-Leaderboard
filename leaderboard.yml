name: Daily leaderboard
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 23:30 UTC = 4:30pm PST — inside his 3-6pm PST update window
  workflow_dispatch: {}        # lets you run it manually any time
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "board $(date -u +%F)" || echo "no changes"
          git push
